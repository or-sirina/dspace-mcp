[project]
name = "dspace-mcp"
version = "0.1.0"
description = "MCP server for AI-agent operation of DSpace repositories (SAF build, CLI ops, metadata, scientometrics, OA download)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "V. V. Vinogradov" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "dspace",
    "institutional-repository",
    "scientometrics",
    "open-access",
    "metadata",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.2.0",
    "chardet>=5.0",
    "lxml>=4.9",
    "requests>=2.31",
    "aiohttp>=3.9",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/or-sirina/dspace-mcp"
Repository = "https://github.com/or-sirina/dspace-mcp"
Issues = "https://github.com/or-sirina/dspace-mcp/issues"

[project.scripts]
dspace-mcp = "dspace_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspace_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
